
<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maison Elysee Floral</title>
<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f7f2e8;
  }
  h1{
    text-align:center;
  }
  p{
    text-align:center;
  }
  button{
    display:block;
    margin:30px auto;
    padding:18px 45px;
    background:#b08d57;
    color:white;
    border:none;
    border-radius:50px;
    font-size:18px;
  }
 .hero{
      height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      color:white;
      background-image:url("Erou.png .PNG");
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;
      border-radius: 0;
      padding: 20px;
      background-color:rgba(0,0,0,0.35);
      background-blend-mode:multiply;
   }
  .hero h1{
      color:white;
      font-size:80px;
      font-weight:bold;
  }
  .hero p{
      color:white;
      font-size:28px;
    }
 nav{
     position:fixed;
     top:0;
     width:100%;
     padding:25px;
     text-align:center;
     background:rgba(255,255,255,0.15);
     backdrop-filter:blur(12px);
  }
  nav a{
     color:white;
     text-decoration:none;
     margin:0 25px;
     font-size:18px;
     font-weight:bold;
  }
  .logo{
     position:absolute;
     left:40px;
     color:white;
     font-size:28px;
     font-weight:bold;
     letter-spacing:2px;
  }
  .menu{
     display:flex;
     justify-content:center;
   }
   .collection{
     padding:100px 50px;
     background:white;
     text-align:center;
  }
   .collection h2{
      font-size:48px;
      margin-bottom:50px;
      color:#2f2f2f;
  }
  .products{
     display:flex;
     justify-content:center;
     gap:40px;
     flex-wrap:wrap;
  }
   .card{
      width:300px;
      background:#faf8f5;
      padding:30px;
      border-radius:20px;
      box-shadow:0 10px 30px rgba(0,0,0,0.1);
   }
   .card h3
      font-size:26px;
      margin-bottom:15px;
   }
   .card p{
      color:#b08d57;
      font-size:24px;
      font-weight:bold;
   }
   .card img{
      width:100%;
      height:260px;
      object-fit:cover;
      border-radius:15px;
      margin-bottom:20px;
   }
  </style>
  
    
</head>
<body>
<nav>
  <div class="logo">Maison Elysee Floral</div>
  <div class="menu">
  <a href="#">Acasa</a>
  <a href="#">Colectie</a>
  <a href="#">Despre noi</a>
  <a href="#">Contact</a>
 </div>
 </nav>
<div class="hero">
  <h1>Maison Elysee Floral</h1>
  <p>Flori parfumate si cadouri create pentru momente speciale.</p>
  <button>Descopera colectia</button>
  </div>
 <section class="collection">
   <h2>Colectia Noastra</h2>
   <div class="products">
     <div class="card">
     <img src="box9.jpg" alt="Box 9 trandafiri">
       <h3>Box cu 9 trandafiri</h3>
       <p>399 lei</p>
     </div>
     <div class="card">
     <img src="premium.jpg" alt="Box Premium">
        <h3>Box Premium</h3>
        <p>699 lei</p>
     </div>
     <div class="card">
     <img src="lumanare.jpg" alt="Lumanare parfumata">
        <h3>Lumanare parfumata</h3>
        <p>299 lei</p>
      </div>
    </div>
   </section>
</body>
</html>
